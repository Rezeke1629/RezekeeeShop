<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/intl-tel-input@25.3.1/build/css/intlTelInput.css">
    <link rel="stylesheet" href="store-actions.css?v=6">
    <link rel="stylesheet" href="site-shared.css?v=2">
    <link rel="stylesheet" href="home-page.css?v=6">
    <link rel="stylesheet" href="chrome.css?v=1">
    <title>Contact | RezekeeeShop</title>
</head>
<body class="home-page">
    <div id="site-header"></div>
    <main class="content" id="mainContent">
        <h1>Contact Us</h1>
        <div style="max-width:900px;margin:0 auto;text-align:left;display:grid;grid-template-columns:1fr 1fr;gap:24px;">
            <section style="border:1px solid var(--line);border-radius:12px;padding:16px;background:var(--panel-card);">
                <h2 style="color:var(--heading);">Showroom details</h2>
                <p>Sales showroom: 096 511 0561</p>
                <p>Opening hours: Monday to Sunday, 8:00 AM to 5:30 PM.</p>
                <h2 style="color:var(--heading);margin-top:12px;">Location</h2>
                <iframe title="Google Maps" src="https://www.google.com/maps?q=Phnom+Penh&output=embed" width="100%" height="220" style="border:0;border-radius:8px;" loading="lazy"></iframe>
            </section>
            <section style="border:1px solid var(--line);border-radius:12px;padding:16px;background:var(--panel-card);">
                <h2 style="color:var(--heading);">Send a message</h2>
                <form style="display:grid;gap:10px;">
                    <input class="search-input" type="text" placeholder="Your name" aria-label="Your name">
                    <input class="search-input" type="email" placeholder="Your email" aria-label="Your email">
                    <textarea class="search-input" rows="4" placeholder="Message" aria-label="Message"></textarea>
                    <button class="store-action-button" type="submit" style="width:100%;">Send</button>
                </form>
            </section>
        </div>
    </main>
    <div id="site-footer"></div>
    <script src="store-actions.js?v=5"></script>
    <script src="layout.js?v=1"></script>
</body>
</html>
